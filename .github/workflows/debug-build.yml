name: Debug Build ArquiManager

on:
  push:
    branches: [main]

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build with captured log
        id: build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          echo "$status" > build-status.txt
          cat build.log
          exit 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arquimanager-build-diagnostics
          path: |
            build.log
            build-status.txt
          if-no-files-found: error

      - name: Return build status
        shell: bash
        run: exit "$(cat build-status.txt)"
